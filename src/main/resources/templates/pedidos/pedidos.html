<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | El Chinito</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/layout :: cabecera('pedidos','pedidos')}"></header>
<main>
<h2>Pedidos</h2>
<div class="actions"><a class="link-button" th:href="@{/pedidos/nuevo}">Nuevo pedido</a></div>
<section class="panel"><form method="get" th:action="@{/pedidos}">
<label for="estado">Filtrar por estado</label><select id="estado" name="estado">
<option value="">Todos</option><option th:each="e : ${estados}" th:value="${e}" th:text="${e}" th:selected="${e == estadoActual}"></option></select>
<div class="actions"><button type="submit">Filtrar</button><a class="link-button secondary" th:href="@{/pedidos}">Limpiar</a></div></form></section>
<section class="panel table-wrap"><table><thead><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Entrega comprometida</th><th>Ítems</th><th>Estado</th><th></th></tr></thead><tbody>
<tr th:each="p : ${pedidos}"><td th:text="${p.id()}"></td>
<td th:text="${#temporals.format(p.fechaPedido(),'dd/MM/yyyy HH:mm')}"></td>
<td th:text="${clientes[p.idCliente()]}"></td><td th:text="${p.tipo()}"></td>
<td th:text="${p.fechaEntregaComprometida() != null ? #temporals.format(p.fechaEntregaComprometida(),'dd/MM/yyyy') : '-'}"></td>
<td th:text="${#lists.size(p.lineas())}"></td><td th:text="${p.estado()}"></td>
<td><a th:href="@{/pedidos/{id}(id=${p.id()})}">Ver detalle</a></td></tr></tbody></table>
<p th:if="${#lists.isEmpty(pedidos)}" class="muted">No hay pedidos para mostrar.</p></section>
</main><footer>Confecciones El Chinito · Pedidos y producción</footer></body></html>
