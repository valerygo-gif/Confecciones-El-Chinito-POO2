<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar compra | El Chinito</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/layout :: cabecera('compras','compras')}"></header>
<main>
<h2>Registrar compra</h2>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<section class="panel"><form method="post" th:action="@{/compras}">
<label for="idProveedor">Proveedor</label><select id="idProveedor" name="idProveedor" required>
<option value="">Selecciona un proveedor</option><option th:each="p : ${proveedores}" th:value="${p.id()}" th:text="${p.nombre()}"></option></select>
<label for="nroDocumento">N.º de documento (factura/boleta)</label><input id="nroDocumento" name="nroDocumento" maxlength="60">
<h3>Ítems</h3><p class="muted small">Completa solo las filas necesarias. Los productos se compran en unidades enteras.</p>
<div class="table-wrap"><table><thead><tr><th>Ítem</th><th>Cantidad</th><th>Precio unitario</th></tr></thead><tbody>
<tr th:each="i : ${#numbers.sequence(1, filas)}">
<td><select name="item"><option value="">-</option>
<optgroup label="Materiales"><option th:each="m : ${materiales}" th:value="${'MATERIAL:' + m.key}" th:text="${m.value}"></option></optgroup>
<optgroup label="Productos"><option th:each="v : ${variantes}" th:value="${'PRODUCTO:' + v.key}" th:text="${v.value}"></option></optgroup></select></td>
<td><input name="cantidad" type="number" step="0.001" min="0"></td><td><input name="precio" type="number" step="0.01" min="0"></td></tr></tbody></table></div>
<div class="actions"><button type="submit">Registrar compra</button><a class="link-button secondary" th:href="@{/compras}">Cancelar</a></div>
</form></section>
</main><footer>Confecciones El Chinito · Compras, costos y reportes</footer></body></html>
