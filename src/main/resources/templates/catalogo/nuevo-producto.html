<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar o editar producto | El Chinito</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header th:replace="~{fragments/layout :: cabecera('catalogo','productos')}"></header>
<main>
<h2 th:text="${titulo}">Nuevo producto</h2>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<section class="panel"><form method="post" th:action="${accion}" th:object="${form}">
<label for="nombre">Nombre</label><input id="nombre" th:field="*{nombre}" maxlength="150" required placeholder="Ej. Blusa de marinera limeña">
<label for="categoria">Categoría</label><select id="categoria" th:field="*{categoriaId}" required>
<option value="">Seleccione</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option></select>
<label for="tipo">Tipo</label><select id="tipo" th:field="*{tipo}" required><option value="PRENDA">Prenda</option><option value="ACCESORIO">Accesorio</option></select>
<label for="danza">Danza (opcional)</label><select id="danza" th:field="*{danzaId}"><option value="">No aplica</option>
<option th:each="d : ${danzas}" th:value="${d.id}" th:text="${d.region != null ? d.nombre + ' (' + d.region.nombre + ')' : d.nombre}"></option></select>
<label for="descripcion">Descripción</label><textarea id="descripcion" th:field="*{descripcion}"></textarea>
<div class="actions"><button type="submit">Guardar producto</button><a class="link-button secondary" th:href="@{/catalogo/productos}">Cancelar</a></div>
</form></section>
<p class="muted small">Primero registra las categorías y danzas en <a th:href="@{/catalogo/maestros}">Datos del catálogo</a>. Las tallas se asignan al crear variantes.</p>
</main><footer>Confecciones El Chinito · Gestión de catálogo e inventario</footer></body></html>
