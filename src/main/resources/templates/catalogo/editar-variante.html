<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar variante | El Chinito</title>
<link rel="stylesheet" th:href="@{/css/app.css}"></head><body>
<header><h1>Confecciones El Chinito</h1><p>POO II · Módulo 1 · Catálogo e inventario</p>
<nav><a th:href="@{/catalogo/productos}">Productos</a><a th:href="@{/catalogo/inventario}">Inventario</a>
<a th:href="@{/catalogo/materiales}">Materiales</a><a th:href="@{/catalogo/maestros}">Datos del catálogo</a>
<a th:href="@{/catalogo/ubicaciones}">Ubicaciones</a></nav></header>
<main>
<h2>Editar variante <span th:text="${variante.id}"></span></h2>
<p class="muted">Producto: <strong th:text="${variante.producto.nombre}"></strong></p>
<p class="alert" th:if="${error}" th:text="${error}"></p>
<section class="panel"><form method="post" th:action="@{/catalogo/variantes/{id}/editar(id=${variante.id})}" th:object="${form}">
<label>Talla</label><select th:field="*{tallaId}">
<option value="" th:text="${variante.producto.tipo.toString() == 'ACCESORIO' ? 'Sin talla (Única)' : 'Seleccione'}"></option>
<option th:each="t : ${tallas}" th:value="${t.id}" th:text="${t.etiqueta}"></option></select>
<label>SKU (opcional)</label><input th:field="*{sku}" maxlength="70">
<label>Precio referencial (S/)</label><input th:field="*{precio}" type="number" min="0" step="0.01" required>
<label>Stock mínimo</label><input th:field="*{stockMinimo}" type="number" min="0" step="1" required>
<div class="actions"><button type="submit">Guardar cambios</button><a class="link-button secondary" th:href="@{/catalogo/productos/{id}(id=${variante.producto.id})}">Cancelar</a></div>
</form></section>
</main><footer>Confecciones El Chinito · Gestión de catálogo e inventario</footer></body></html>
